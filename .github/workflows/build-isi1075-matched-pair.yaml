name: Build controller+golang-adk (ISI-1075 matched pair)

# Builds the ISI-1075 memory-spans matched pair into the FORK's GHCR namespace.
# `make build-controller` cascades: it builds+pushes app, app-full, golang-adk,
# golang-adk-full, acp-sandbox-{openclaw,hermes}, then bakes their registry
# digests into the controller binary (scripts/controller-digest-ldflags.sh) so
# the declarative Go runtime resolves to THIS golang-adk. Single job => no matrix
# fail-fast. Critically sets DOCKER_REPO=henrikrexed/kagent (tag.yaml does not,
# so tag.yaml pushes to kagent-dev and gets permission_denied).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag/version'
        default: 'isi1075-d1bed5f6'
  push:
    branches:
      - ci/isi-1682-matched-pair
      - ci/isi-1683-memory-write-span
      - ci/isi-1726-python-matched-pair

jobs:
  build-matched-pair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_REGISTRY: ghcr.io
      DOCKER_REPO: henrikrexed/kagent
      DOCKER_BUILD_ARGS: "--push --platform linux/amd64,linux/arm64"
      DOCKER_BUILDER: "docker buildx build"
      VERSION: ${{ github.event.inputs.version || 'isi1075-d1bed5f6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: kagent-builder-v0.23.0
          platforms: linux/amd64,linux/arm64
          version: v0.23.0
          use: 'true'

      - name: Build and push controller + golang-adk matched pair
        run: |
          echo "Building matched pair -> ${DOCKER_REGISTRY}/${DOCKER_REPO}/{controller,golang-adk}:${VERSION}"
          make build-controller
          echo "== resolving pushed digests =="
          make image-info || true
